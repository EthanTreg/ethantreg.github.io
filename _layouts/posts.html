---
layout: default
script_includes:
  - comment
---

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/assets/js/data/mathjax.js"></script>
<script id="MathJax-script" async="" src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

<script>
  const PER_PAGE = {{ site.per_page | jsonify }};
  const AUTHORS = {{ site.data.authors | jsonify }};
  const POSTS = {{ site[page.posts_data] | jsonify }};
</script>
<script src="{{ site.baseurl }}{% link assets/js/posts.js %}"></script>

<div id="post-list" class="flex-grow-1 px-xl-1"></div>

<nav aria-label="Page Navigation">
  <ul id="pagination" class="pagination align-items-center mt-4 mb-0">
    <li id="previous" class="page-item disabled">
      <button id="previous-btn" class="page-link" aria-label="previous-page" type="button" onclick="this.blur()">
        <i class="fas fa-angle-left"></i>
      </button>
    </li>
    <li id="next" class="page-item">
      <button id="next-btn" class="page-link" aria-label="next-page" type="button" onclick="this.blur()">
        <i class="fas fa-angle-right"></i>
      </button>
    </li>
  </ul>
</nav>
